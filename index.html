
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foldit Coffee Club | Staff Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f3ed;
      color: #29271f;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 460px;
      background: white;
      border-radius: 22px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 32px #0000000c;
    }
    .brand {
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 700;
      color: #756b58;
    }
    h1 { font-size: 30px; margin: 12px 0 8px; }
    p { color: #68645c; line-height: 1.5; }
    .status {
      background: #f6f3ed;
      border-radius: 12px;
      padding: 18px;
      margin-top: 24px;
    }
    .status strong { display: block; margin-bottom: 6px; }
    .note { font-size: 13px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">F O L D I T</div>
    <h1>Coffee Club</h1>
    <p>Staff redemption scanner</p>
    <div class="status">
      <strong>Scanner setup in progress</strong>
      <p>Once connected, you’ll be able to scan a member’s QR code and check their daily coffee allowance.</p>
    </div>
    <p class="note">Staff access only · Foldit Coffee Club</p>
  </main>
</body>
</html>
