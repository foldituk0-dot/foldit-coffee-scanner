
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fold It Coffee Club</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      color: #667344;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 16px;
    }
    button { cursor: pointer; }
    #details { margin-top: 25px; }
    #qr { margin: 20px auto; }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Fold It Coffee Club</h1>
  <p>Your daily coffee, on us.</p>

  <form id="login-form">
    <input id="email" type="email" placeholder="Email address" required>
    <input id="password" type="password" placeholder="Password" required>
    <button id="login-button" type="submit">Sign in</button>
  </form>

  <section id="details" hidden>
    <h2>Your Membership</h2>
    <p id="status"></p>
    <p id="expiry"></p>
    <p>Show this QR code to staff for your daily coffee.</p>
    <canvas id="qr"></canvas>
    <p id="qr-expiry"></p>
    <button id="signout-button" type="button">Sign out</button>
  </section>

  <p id="message"></p>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import QRCode from "https://esm.sh/qrcode@1.5.4";

    const SUPABASE_URL = "https://ussarummnhjahsilugrb.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yyz0YzcwSw1BYWjnfGsS4A_hj8-Cq-m";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.getElementById("login-form");
    const loginButton = document.getElementById("login-button");
    const details = document.getElementById("details");
    const status = document.getElementById("status");
    const expiry = document.getElementById("expiry");
    const canvas = document.getElementById("qr");
    const message = document.getElementById("message");
    const qrExpiry = document.getElementById("qr-expiry");

    let session = null;
    let qrRefreshTimer = null;
const DEVICE_STORAGE_KEY = "foldit_device_id";

let deviceId = localStorage.getItem(DEVICE_STORAGE_KEY);

if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem(DEVICE_STORAGE_KEY, deviceId);
}
    function showMessage(text) {
      message.textContent = text;
    }

    async function generateDailyQR() {if (qrRefreshTimer) clearTimeout(qrRefreshTimer);
qrRefreshTimer = null;
      showMessage("Creating your daily QR code...");
      canvas.hidden = true;
      qrExpiry.textContent = "";

      const { data, error } = await supabase.functions.invoke(
  "generate-daily-qr",
  {
    body: {
      device_id: deviceId
    },
    headers: {
      Authorization: `Bearer ${session.access_token}`
    }
  }
);

      if (error || !data || !data.success || !data.qr_token) {
        showMessage(data?.error || error?.message || "Could not create your QR code.");
        return;
      }

      try {
        await QRCode.toCanvas(canvas, data.qr_token, {
          width: 240,
          margin: 2
        });
        canvas.hidden = false;
        qrExpiry.textContent = "QR code refreshes every 15 seconds.";
qrRefreshTimer = setTimeout(() => {
  if (session) generateDailyQR();
}, 14000);
        showMessage("Your daily coffee QR code is ready.");
      } catch (err) {
        showMessage("Could not display your QR code.");
        console.error(err);
      }
    }

    async function refreshSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error) {
        showMessage("Could not check your sign-in.");
        return;
      }

      session = data.session;

      if (!session) {
        form.hidden = false;
        details.hidden = true;
        return;
      }

      form.hidden = true;
      showMessage("Signed in as " + session.user.email);

      const { data: member, error: memberError } = await supabase
        .from("members")
        .select("subscription_status, membership_expires_at")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (memberError) {
        showMessage("Could not load membership: " + memberError.message);
        details.hidden = true;
        return;
      }

      if (!member) {
        showMessage("Your login is working, but no membership record was found.");
        details.hidden = true;
        return;
      }

      details.hidden = false;
      status.textContent = "Membership status: " + member.subscription_status;
      expiry.textContent = "Membership expires: " + member.membership_expires_at;

      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const today = `${parts.find(p => p.type === "year").value}-${parts.find(p => p.type === "month").value}-${parts.find(p => p.type === "day").value}`;

      if (
        member.subscription_status === "active" &&
        member.membership_expires_at &&
        member.membership_expires_at >= today
      ) {
        await generateDailyQR();
      } else {
        canvas.hidden = true;
        showMessage("Your membership is inactive or expired.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      showMessage("Signing in...");

      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        showMessage(error.message);
      } else {
        await refreshSession();
      }

      loginButton.disabled = false;
    });

    document.getElementById("signout-button").addEventListener("click", async () => {
      await supabase.auth.signOut();
      session = null;
      canvas.hidden = true;
      details.hidden = true;
      form.hidden = false;
      showMessage("You have signed out.");
    });

    await refreshSession();
  </script>
</body>
</html>
