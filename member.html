
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foldit Coffee Club</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f1e9;
      color: #29251f;
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }
    h1 { margin-top: 0; }
    p { line-height: 1.5; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #c9c2b7; }
    button {
      border: 0;
      background: #29251f;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Foldit Coffee Club ☕</h1>
    <p>Sign in to your membership or create your account.</p>

    <form id="auth-form">
      <input id="email" type="email" placeholder="Email address"
        autocomplete="email" required>
      <input id="password" type="password" placeholder="Password"
        autocomplete="current-password" minlength="8" required>
      <button type="submit" id="signin">Sign in</button>
    </form>

    <p id="message" role="status"></p>
    <section id="member-details" hidden>
  <h2>Your Membership</h2>
  <p id="membership-status"></p>
  <p id="membership-expiry"></p>

  <h2>Your Daily Coffee QR Code</h2>
  <p>Show this code to a member of staff when claiming your coffee.</p>
  <canvas id="daily-qr"></canvas>
  <p id="qr-message" role="status"></p>
</section>
    <button id="signout" hidden>Sign out</button>
  </main>

  <script type="module">
   import { createClient } from
  "https://esm.sh/@supabase/supabase-js@2";
import { toCanvas } from
  "https://esm.sh/qrcode@1.5.4";

    const SUPABASE_URL =
      "https://ussarummnhjahsilugrb.supabase.co";

    // Replace this placeholder with your Supabase publishable key.
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yyz0YzcwSw1BYWjnfGsS4A_hj8-Cq-m";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("auth-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const signin = document.getElementById("signin");
    const signout = document.getElementById("signout");

    function showMessage(text) {
      message.textContent = text;
    }

async function generateDailyQR() {
  const qrMessage = document.getElementById("qr-message");
  const canvas = document.getElementById("daily-qr");

  qrMessage.textContent = "Preparing your daily QR code...";

  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    qrMessage.textContent = "Please sign in first.";
    return;
  }

  const { data, error } = await supabase.functions.invoke(
    "generate-daily-qr",
    {
      headers: {
        Authorization: `Bearer ${session.access_token}`
      }
    }
  );

  if (error || !data?.success || !data?.qr_token) {
    qrMessage.textContent =
      data?.error || error?.message || "Could not create your QR code.";
    return;
  }

  try {
  await toCanvas(canvas, data.qr_token, {
      width: 240,
      margin: 2
    });

    qrMessage.textContent =
      "Your daily coffee QR code is ready. It expires at midnight UK time.";
  } catch {
    qrMessage.textContent = "Could not display your QR code.";
  }
}


async function refreshSession() {
  const { data: { session } } = await supabase.auth.getSession();

  form.hidden = Boolean(session);
  signout.hidden = !session;

  const details = document.getElementById("member-details");
  const status = document.getElementById("membership-status");
  const expiry = document.getElementById("membership-expiry");

  if (!session) {
    details.hidden = true;
    return;
  }

  showMessage("Signed in as " + session.user.email);

  const { data: member, error } = await supabase
    .from("members")
    .select("subscription_status, membership_expires_at")
    .eq("user_id", session.user.id)
    .maybeSingle();

  if (error) {
    showMessage("Could not load membership: " + error.message);
    details.hidden = true;
    return;
  }

  if (!member) {
    showMessage("Your login is working, but no membership record was found.");
    details.hidden = true;
    return;
  }

  details.hidden = false;
  status.textContent = "Membership status: " + member.subscription_status;
  expiry.textContent = "Membership expires: " + member.membership_expires_at;
}
if (
  member.subscription_status === "active" &&
  member.membership_expires_at >=
    new Date().toLocaleDateString("en-CA", {
      timeZone: "Europe/London"
    })
) {
  await generateDailyQR();
}
    
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      signin.disabled = true;
      showMessage("Signing in...");

      const { error } = await supabase.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });

      signin.disabled = false;

      if (error) {
        showMessage(error.message);
        return;
      }

      await refreshSession();
    });

    signout.addEventListener("click", async () => {
  await supabase.auth.signOut();
  document.getElementById("member-details").hidden = true;
  document.getElementById("daily-qr").getContext("2d").clearRect(
    0, 0,
    document.getElementById("daily-qr").width,
    document.getElementById("daily-qr").height
  );
  showMessage("You have signed out.");
  await refreshSession();
});

    await refreshSession();
  </script>
</body>
</html>
